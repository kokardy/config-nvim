name: Lua Format Check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download EmmyLuaCodeStyle (CodeFormat)
        run: |
          mkdir -p /tmp/codeformat
          curl -sSL https://github.com/CppCXY/EmmyLuaCodeStyle/releases/download/1.6.0/linux-x64.tar.gz \
            | tar -xz -C /tmp/codeformat
          chmod +x /tmp/codeformat/linux-x64/bin/CodeFormat

      - name: Check Lua formatting
        run: |
          /tmp/codeformat/linux-x64/bin/CodeFormat check -f init.lua -c .editorconfig --diagnosis-as-error
          /tmp/codeformat/linux-x64/bin/CodeFormat check -f filetype.lua -c .editorconfig --diagnosis-as-error
          /tmp/codeformat/linux-x64/bin/CodeFormat check -w lua -c .editorconfig --diagnosis-as-error
